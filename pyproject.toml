[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Enable pydocstyle rules (D) and flake8-comprehensions (C4)
# alongside the default flake8 (F) and pyflakes (E) rules.
select = ["E", "F", "D", "C4"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"
